defaults:
  - data: amazon2014
  - tokenization: ast
  - model: t5
  - training: default
  - _self_
  - experiment: null               # e.g. experiment=beauty (paper Table 1 settings)

seed: 42
stop_after: null                   # null (full run) | embed | sids
experiment_name: AST

generation:
  num_beams: 10
  num_return_sequences: 10
  do_sample: false

joint_training:
  enabled: false
  temperature: 1.0
  learn_item_embs: true
  commit_loss_weight: 0.0
  balance_loss_weight: 0.0
  suffix_refresh_steps: 200

debug:
  train_select: null               # e.g. [0, 1, 2] to train on a few examples
  eval_limit: null                 # e.g. 500 to evaluate on the first 500 users (quick checks only)
  stop_at_step: null               # e.g. 2000: stop training there (same LR schedule), write train_log.json, skip test

hydra:
  run:
    dir: outputs/${data.category}/${tokenization.variant}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${data.category}_${tokenization.variant}
  job:
    chdir: false
